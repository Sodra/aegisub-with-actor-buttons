name: Actor Buttons Windows build

on:
  push:
    branches: [actor-buttons]
    tags: ['actor-buttons-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install Meson
        run: python -m pip install meson
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install build dependencies
        shell: pwsh
        run: |
          choco install ninja innosetup -y
          Invoke-WebRequest 'https://github.com/leafo/moonscript/releases/download/v0.6.0/moonscript-v0.6.0-windows-x86_64.zip' -OutFile moonscript.zip
          New-Item -ItemType Directory moonscript | Out-Null
          7z e moonscript.zip -omoonscript
          (Resolve-Path moonscript).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Invoke-WebRequest 'https://github.com/mlocati/gettext-iconv-windows/releases/download/v1.0-v1.18-r3/gettext1.0-iconv1.18-static-64.zip' -OutFile gettext.zip
          Expand-Archive gettext.zip -DestinationPath gettext
          (Resolve-Path gettext/bin).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure
        run: >-
          meson setup build --buildtype=release -Ddefault_library=static
          --force-fallback-for=zlib,harfbuzz,freetype2,fribidi,libpng
          -Dfallback_nasm=true -Dfreetype2:harfbuzz=disabled
          -Dharfbuzz:freetype=disabled -Dharfbuzz:cairo=disabled
          -Dharfbuzz:glib=disabled -Dharfbuzz:gobject=disabled
          -Dharfbuzz:tests=disabled -Dharfbuzz:docs=disabled
          -Dfribidi:tests=false -Dfribidi:docs=false -Dlibass:fontconfig=disabled
      - name: Build and test
        run: |
          meson compile -C build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          meson test -C build --verbose 'gtest main'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows portable
        run: meson compile -C build win-portable
      - uses: actions/upload-artifact@v6
        with:
          name: Aegisub-actor-buttons-windows-portable
          path: build/aegisub-portable-64.zip
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/actor-buttons-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create '${{ github.ref_name }}' build/aegisub-portable-64.zip --title 'Aegisub with Actor Buttons ${{ github.ref_name }}' --notes 'Windows portable build of Aegisub with Actor Buttons.'
